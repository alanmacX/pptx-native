<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  .slide{position:relative;width:1280px;height:720px;background:#FFFFFF;overflow:hidden;}
  .ppt-textbox{position:absolute;color:#0F1B2D;}
  .ppt-shape{position:absolute;}
</style>
</head>
<body>

<!-- Slide 2/3 carry the SAME title text; auto:true morph-matches it by content
     signature so it glides to its new position/size. -->

<section class="slide" data-slide="1" data-ppt-transition="type:fade">
  <div class="ppt-textbox" style="left:120px;top:300px;width:1040px;font-size:64px;font-weight:800;">OceanBase 高可用</div>
  <div class="ppt-shape" data-shape="roundRect" style="left:120px;top:430px;width:300px;height:8px;background:#0E9F8E;border-radius:4px;"></div>
</section>

<section class="slide" data-slide="2" data-ppt-transition="type:morph; auto:true">
  <!-- same title text, smaller and moved up -> should morph (glide + shrink) -->
  <div class="ppt-textbox" style="left:120px;top:80px;width:1040px;font-size:34px;font-weight:800;">OceanBase 高可用</div>
  <div class="ppt-shape" data-shape="roundRect" style="left:120px;top:140px;width:160px;height:6px;background:#0E9F8E;border-radius:3px;"></div>
  <div class="ppt-textbox" style="left:120px;top:200px;width:900px;font-size:18px;color:#5B6B7F;line-height:1.7;">多副本基于 Paxos，多数派确认才提交；少数节点故障仍可继续服务，兼顾可用性与一致性。</div>
</section>

<section class="slide" data-slide="3" data-ppt-transition="type:morph; auto:true">
  <!-- title persists again -> continues to morph across the third slide -->
  <div class="ppt-textbox" style="left:120px;top:80px;width:1040px;font-size:34px;font-weight:800;">OceanBase 高可用</div>
  <div class="ppt-shape" data-shape="roundRect" style="left:120px;top:140px;width:160px;height:6px;background:#0E9F8E;border-radius:3px;"></div>
  <div class="ppt-textbox" style="left:120px;top:220px;width:900px;font-size:18px;color:#5B6B7F;line-height:1.7;">写请求由主副本处理并复制日志；主副本不可用时通过选举产生新主，对应用透明。</div>
</section>

</body>
</html>
