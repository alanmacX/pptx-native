<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../web/ppt-components.css">
<style>
  body { margin: 0; background: #d8d8d8; font-family: Arial, sans-serif; }
  .ppt-slide { background: #f7f4ee; color: #17202a; }
  .ppt-slide + .ppt-slide { margin-top: 20px; }
  [data-ppt-region="title"], [data-ppt-role="title"] { font-weight: 800; line-height: 1.08; }
  [data-ppt-region="support"], [data-ppt-region="interpretation"],
  [data-ppt-region="evidence"], [data-ppt-region="action"] { font-size: 20px; line-height: 1.45; }
  [data-ppt-region="metric"] { font-size: 88px; font-weight: 850; }
</style>
</head>
<body
  data-ppt-visual-strategy="image-led"
  data-ppt-creative-direction="warm editorial geometry with varied focal scale">
<section class="ppt-slide" data-ppt-layout="cover">
  <div class="ppt-textbox" data-ppt-region="title" style="font-size:60px;text-align:center;">六种轮廓，不是一套模板</div>
  <div class="ppt-textbox" data-ppt-region="subtitle" style="font-size:22px;text-align:center;">内容决定构图，preset 只给几何起点</div>
</section>

<section class="ppt-slide" data-ppt-layout="statement">
  <div class="ppt-textbox" data-ppt-region="title" style="font-size:52px;">先决定观众要带走什么</div>
  <div class="ppt-textbox" data-ppt-region="support">一句能被复述的判断，比填满页面更重要。</div>
</section>

<section class="ppt-slide" data-ppt-layout="split">
  <div data-ppt-region="copy">
    <div class="ppt-textbox" data-ppt-role="title"
      style="left:0;top:32px;width:472px;height:154px;font-size:40px;font-weight:800;line-height:1.08;">视觉锚点先于装饰</div>
    <div class="ppt-textbox"
      style="left:0;top:238px;width:420px;height:150px;font-size:20px;line-height:1.45;">图片要提供证据、场景或身份；否则宁可让文字独占舞台。</div>
  </div>
  <img class="ppt-picture" data-ppt-region="media" alt=""
    src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
</section>

<section class="ppt-slide" data-ppt-layout="evidence">
  <div class="ppt-textbox" data-ppt-region="title" style="font-size:36px;">证据在左，解释在右</div>
  <img class="ppt-picture" data-ppt-region="visual" alt=""
    src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
  <div class="ppt-textbox" data-ppt-region="interpretation">先看见事实，再读到它为什么改变结论。</div>
</section>

<section class="ppt-slide" data-ppt-layout="metric">
  <div class="ppt-textbox" data-ppt-region="metric">11个月</div>
  <div class="ppt-textbox" data-ppt-region="evidence">试点回本周期；收益集中在两个高频场景。</div>
  <div class="ppt-textbox" data-ppt-region="title" style="font-size:36px;">数字必须带来一个判断</div>
</section>

<section class="ppt-slide" data-ppt-layout="closing">
  <div class="ppt-textbox" data-ppt-region="title" style="font-size:52px;">下一页不该长得和这一页一样</div>
  <div class="ppt-textbox" data-ppt-region="action">变化来自信息关系，不是换一个背景色。</div>
</section>
</body>
</html>
