<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"PingFang SC","Microsoft YaHei","Aptos",Arial,sans-serif; background:#111; }
  .ppt-slide { position:relative; width:1280px; height:720px; overflow:hidden; background:#F7F8FB; }
  .ppt-shape { position:absolute; }
  .ppt-textbox { position:absolute; color:#0F1B2D; line-height:1.28; }
  .bg-drift { opacity:.42; filter:blur(1.5px); }
  .halo { opacity:.30; }
  .spark { opacity:.55; }
  .title { font-size:42px; font-weight:850; }
  .sub { font-size:18px; color:#5B677A; line-height:1.55; }
</style>
</head>
<body>
<section class="ppt-slide" data-ppt-motion-preset="elegant" data-ppt-motion-intent="ambient" data-ppt-transition="type:fade">
  <div data-ppt-ambient="drift; selector:.bg-drift; x:24; y:-14; dur:9000; repeat:infinite; alt; ease:inout">
    <div class="ppt-shape bg-drift" data-shape="ellipse" style="left:78px;top:86px;width:280px;height:190px;background:radial-gradient(circle,#85D7C7,#DDF5F0);border-radius:50%;"></div>
    <div class="ppt-shape bg-drift" data-shape="ellipse" style="left:890px;top:92px;width:320px;height:220px;background:radial-gradient(circle,#A9B9FF,#EEF0FF);border-radius:50%;"></div>
    <div class="ppt-shape bg-drift" data-shape="ellipse" style="left:820px;top:500px;width:360px;height:170px;background:radial-gradient(circle,#FFDFAE,#FFF6D8);border-radius:50%;"></div>
  </div>
  <div data-ppt-ambient="breathe; selector:.halo; scaleFrom:.96; scaleTo:1.045; dur:7600; repeat:infinite; alt; ease:inout">
    <div class="ppt-shape halo" data-shape="ellipse" style="left:492px;top:248px;width:296px;height:224px;background:#0E9F8E;border-radius:50%;box-shadow:0 0 36px rgba(14,159,142,.35);"></div>
  </div>
  <div data-ppt-ambient="path; selector:.spark; path:M 0 0 L 0.035 -0.025 L 0.07 0.012 L 0.105 -0.018; dur:9800; repeat:infinite; alt; ease:inout">
    <div class="ppt-shape spark" data-shape="ellipse" style="left:246px;top:512px;width:24px;height:24px;background:#F4B942;border-radius:50%;"></div>
    <div class="ppt-shape spark" data-shape="ellipse" style="left:992px;top:396px;width:18px;height:18px;background:#6B5DD3;border-radius:50%;"></div>
  </div>

  <div class="ppt-shape" data-shape="roundRect" style="left:172px;top:178px;width:936px;height:344px;background:rgba(255,255,255,.88);border:1px solid rgba(15,27,45,.10);border-radius:22px;box-shadow:0 24px 54px rgba(20,27,38,.14);"></div>
  <div class="ppt-textbox title" data-ppt-anim="compose; opacity:in; x:-56; y:12; scaleFrom:.96; scaleTo:1; dur:560; trigger:afterPrev" style="left:228px;top:246px;width:780px;">Ambient background motion</div>
  <div class="ppt-textbox sub" data-ppt-anim="entrance:fade; trigger:afterPrev; dur:420; delay:180" style="left:232px;top:326px;width:740px;">
    Background shapes loop with native compose and motionPath timing while foreground content keeps its own build. This is a generic grammar, not a hard-coded demo.
  </div>
  <div class="ppt-shape" data-shape="rect" data-ppt-anim="entrance:wipe; direction:right; trigger:afterPrev; dur:620; delay:360" style="left:232px;top:432px;width:696px;height:4px;background:linear-gradient(90deg,#0E9F8E,#6B5DD3,#F4B942);"></div>
</section>
</body>
</html>
